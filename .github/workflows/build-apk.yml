name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Setup Java Development Kit (JDK) 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Sync Web Assets to Android Native Project
        run: |
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          test -f ./android/gradlew
          chmod +x ./android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          ./android/gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/Altakhfeed-AlSah-Store.apk
          echo "APK generated successfully at output-apk/Altakhfeed-AlSah-Store.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Altakhfeed-AlSah-Android-APK
          path: output-apk/Altakhfeed-AlSah-Store.apk
          retention-days: 30
